name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  secret-pii-scan:
    name: Quét secret/PII (file thay đổi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Xác định base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Quét
        run: |
          BASE="${{ steps.base.outputs.base }}"
          if [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "Quét diff ${BASE}...${{ github.sha }}"
            python3 tools/scripts/scan_pii_secrets.py --range "$BASE" "${{ github.sha }}"
          else
            echo "Không có base hợp lệ — quét file của commit hiện tại"
            FILES=$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}")
            [ -z "$FILES" ] || python3 tools/scripts/scan_pii_secrets.py $FILES
          fi

  quality:
    name: Typecheck · Lint · Test (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test
